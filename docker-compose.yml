version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: repobuddy-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: repobuddy-server
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/repobuddy
      - CLIENT_URL=http://localhost:5173
    depends_on:
      - mongodb

volumes:
  mongo-data:
